#==================================================
# CoreSales Backend
#==================================================
spring.application.name=service-product

#==================================================
# SERVER
#==================================================
server.port=8081

#==================================================
# DATABASE
#==================================================
spring.datasource.url=jdbc:sqlserver://DESKTOP-74J9C9N:1433;databaseName=CoreSales;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

#==================================================
# JPA / HIBERNATE
#==================================================
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#==================================================
# JSON
#==================================================
#Indica que los atributos cuyo valor sea null no se incluir�n en el JSON de respuesta:
spring.jackson.default-property-inclusion=non_null